name: Stable Release (Legacy Disabled)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stable-release-legacy-disabled
  cancel-in-progress: true

jobs:
  disabled:
    runs-on: ubuntu-latest
    steps:
      - name: Stop legacy release workflow
        run: |
          echo "::error::The legacy Go/Fyne stable release workflow is disabled. Use .github/workflows/v4-release-channels.yml with channel=stable."
          exit 1
