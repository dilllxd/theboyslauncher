name: Dev Prerelease (Legacy Disabled)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dev-prerelease-legacy-disabled
  cancel-in-progress: true

jobs:
  disabled:
    runs-on: ubuntu-latest
    steps:
      - name: Stop legacy prerelease workflow
        run: |
          echo "::error::The legacy Go/Fyne dev prerelease workflow is disabled. Use .github/workflows/v4-release-channels.yml with channel=dev."
          exit 1
