name: Social Backend Image

on:
  workflow_dispatch:
    inputs:
      push_image:
        description: "Push the built image to GitHub Container Registry"
        required: false
        default: true
        type: boolean
  push:
    tags:
      - "v*"
    paths:
      - ".github/workflows/social-backend-image.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/shared/**"
      - "crates/social-backend/**"

permissions:
  contents: read
  packages: write

concurrency:
  group: social-backend-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker-image:
    name: Build social backend image
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: startsWith(github.ref, 'refs/tags/v') || inputs.push_image
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/social-backend
          tags: |
            type=ref,event=tag
            type=raw,value=manual-${{ github.sha }},enable=${{ github.event_name == 'workflow_dispatch' }}

      - name: Build social backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: crates/social-backend/Dockerfile
          push: ${{ startsWith(github.ref, 'refs/tags/v') || inputs.push_image }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=social-backend
          cache-to: type=gha,mode=max,scope=social-backend
