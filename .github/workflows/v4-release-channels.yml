name: V4 Release Channels

on:
  workflow_dispatch:
    inputs:
      channel:
        description: "Release channel to build"
        required: true
        default: dev
        type: choice
        options:
          - dev
          - stable
  push:
    branches:
      - main
      - dev
    paths:
      - ".github/workflows/v4-release-channels.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**"
      - "src-tauri/**"
      - "frontend/**"
      - "package.json"
      - "package-lock.json"
      - "playwright.config.ts"
      - "scripts/clean-tauri-updater-artifacts.mjs"
      - "scripts/configure-tauri-release-channel.mjs"
      - "scripts/generate-tauri-updater-manifest.mjs"
      - "scripts/preflight-v4-release.mjs"
      - "scripts/resolve-v4-release-version.mjs"
      - "scripts/smoke-packaged-exe.mjs"
      - "scripts/stage-social-backend.mjs"
      - "scripts/test-release-channel-scripts.mjs"
      - "scripts/verify-package-resources.mjs"
      - "scripts/verify-tauri-bundles.mjs"
      - "scripts/verify-tauri-security-config.mjs"
      - "tests/e2e/**"

permissions:
  contents: write

concurrency:
  group: v4-release-${{ github.event_name == 'workflow_dispatch' && inputs.channel || github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'push' && github.ref_name == 'dev' }}

jobs:
  release:
    name: Build and publish ${{ github.event_name == 'workflow_dispatch' && inputs.channel || github.ref_name }} channel
    runs-on: windows-latest
    timeout-minutes: 75
    if: github.event_name == 'workflow_dispatch' || github.ref_name == 'main' || github.ref_name == 'dev'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Resolve release channel
        id: channel
        shell: bash
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            channel="${{ inputs.channel }}"
          elif [[ "${GITHUB_REF_NAME}" == "main" ]]; then
            channel="stable"
          elif [[ "${GITHUB_REF_NAME}" == "dev" ]]; then
            channel="dev"
          else
            echo "::error::Unsupported release ref ${GITHUB_REF_NAME}"
            exit 1
          fi
          echo "channel=${channel}" >> "${GITHUB_OUTPUT}"

      - name: Verify official release repository
        shell: pwsh
        run: |
          if ($env:GITHUB_REPOSITORY -ne "dilllxd/theboyslauncher") {
            Write-Error "Release packaging is only allowed from dilllxd/theboyslauncher; current repository is $env:GITHUB_REPOSITORY."
            exit 1
          }

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target

      - name: Install npm dependencies
        run: npm ci

      - name: Resolve next version
        id: version
        run: npm run resolve:v4-release-version -- ${{ steps.channel.outputs.channel }}

      - name: Verify release channel scripts
        run: npm run test:release-channels

      - name: Configure Tauri release channel
        run: npm run configure:tauri-release-channel -- ${{ steps.version.outputs.channel }} ${{ steps.version.outputs.version }}

      - name: Check Rust formatting
        run: cargo fmt --all --check

      - name: Check Rust workspace
        run: cargo check --workspace

      - name: Run launcher-core tests
        run: cargo test -p launcher-core --lib -- --test-threads=1

      - name: Run social-backend tests
        run: cargo test -p social-backend --lib -- --test-threads=1

      - name: Verify Tauri security config
        run: npm run verify:tauri-security

      - name: Build signed Tauri bundles
        run: npm run tauri:build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          THEBOYS_RELEASE_TAG: ${{ steps.version.outputs.channel == 'dev' && 'dev-latest' || steps.version.outputs.tag }}
          THEBOYS_UPDATER_MANIFEST_NAME: ${{ steps.version.outputs.manifest_name }}
          VITE_THEBOYS_RELEASE_CHANNEL: ${{ steps.version.outputs.channel }}

      - name: Smoke packaged executable
        run: npm run smoke:packaged-exe

      - name: Verify Windows bundles
        run: npm run verify:tauri-bundles
        env:
          THEBOYS_UPDATER_MANIFEST_NAME: ${{ steps.version.outputs.manifest_name }}

      - name: Create immutable version tag
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git rev-parse "${{ steps.version.outputs.tag }}" >/dev/null 2>&1; then
            existing_sha="$(git rev-list -n 1 "${{ steps.version.outputs.tag }}")"
            if [[ "${existing_sha}" != "${GITHUB_SHA}" ]]; then
              echo "::error::Tag ${{ steps.version.outputs.tag }} already exists at ${existing_sha}, not ${GITHUB_SHA}."
              exit 1
            fi
            echo "Tag ${{ steps.version.outputs.tag }} already points at ${GITHUB_SHA}; continuing publish retry."
            exit 0
          fi
          git tag "${{ steps.version.outputs.tag }}" "${GITHUB_SHA}"
          git push origin "${{ steps.version.outputs.tag }}"

      - name: Publish stable release
        if: steps.version.outputs.channel == 'stable'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: TheBoysLauncher ${{ steps.version.outputs.tag }}
          prerelease: false
          draft: false
          generate_release_notes: true
          files: |
            target/release/bundle/msi/*.msi
            target/release/bundle/nsis/*setup.exe
            target/release/bundle/**/*.sig
            target/release/bundle/latest.json

      - name: Refresh dev release
        if: steps.version.outputs.channel == 'dev'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $releaseTag = "dev-latest"
          gh release view $releaseTag *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $releaseTag --target "$env:GITHUB_SHA" --title "TheBoysLauncher Dev" --prerelease --notes "Latest development channel build."
          } else {
            gh release edit $releaseTag --target "$env:GITHUB_SHA" --title "TheBoysLauncher Dev" --prerelease --notes "Latest development channel build."
          }

          $assetPatterns = @(
            "target/release/bundle/msi/*.msi",
            "target/release/bundle/nsis/*setup.exe",
            "target/release/bundle/**/*.sig",
            "target/release/bundle/latest-dev.json"
          )
          $assets = @()
          foreach ($pattern in $assetPatterns) {
            $assets += Get-ChildItem -Path $pattern -File
          }
          if ($assets.Count -eq 0) {
            Write-Error "No release assets were found."
            exit 1
          }
          gh release upload $releaseTag @($assets.FullName) --clobber

      - name: Upload Windows installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TheBoysLauncher-${{ steps.version.outputs.channel }}-${{ steps.version.outputs.version }}-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            target/release/bundle/msi/*.msi
            target/release/bundle/nsis/*setup.exe
            target/release/bundle/**/*.sig
            target/release/bundle/latest*.json
